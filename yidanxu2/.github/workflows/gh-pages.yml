name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - hugosite

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3  # Make sure this is the latest version

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'

      - name: Build Hugo site
        run: hugo --source ./yidanxu2  # Specify the directory where your config file exists

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./yidanxu2/public  # Adjust to where your `public/` directory is generated
